<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0,
                 viewport-fit=cover"
    >

    <title>รายการของฉัน</title>

    <link
        rel="stylesheet"
        href="./styles.css?v=5"
    >
</head>

<body>
    <div id="loading-overlay" class="loading-overlay">
        <div class="spinner"></div>
        <p id="loading-message">กำลังเข้าสู่ระบบ...</p>
    </div>

    <div id="app" class="app hidden">
        <header class="header">
            <div>
                <p class="brand">COINLY</p>
                <h1>รายการของฉัน</h1>
            </div>

            <div class="profile">
                <div class="profile-text">
                    <span>สวัสดี</span>
                    <strong id="profile-name">ผู้ใช้</strong>
                </div>

                <img
                    id="profile-image"
                    class="profile-image"
                    alt="รูปโปรไฟล์"
                >
            </div>
        </header>

        <section class="summary-section">
            <div class="summary-card balance-card">
                <span class="summary-label">ยอดคงเหลือ</span>
                <strong id="balance-value">
                    ฿0.00
                </strong>
            </div>

            <div class="summary-grid">
                <div class="summary-card">
                    <span class="summary-label">
                        รายรับทั้งหมด
                    </span>

                    <strong
                        id="income-value"
                        class="income-text"
                    >
                        ฿0.00
                    </strong>
                </div>

                <div class="summary-card">
                    <span class="summary-label">
                        รายจ่ายทั้งหมด
                    </span>

                    <strong
                        id="expense-value"
                        class="expense-text"
                    >
                        ฿0.00
                    </strong>
                </div>
            </div>

            <p id="transaction-count" class="transaction-count">
                0 รายการ
            </p>
        </section>

        <section class="transaction-section">
            <div class="section-heading">
                <h2>ประวัติรายการ</h2>
            </div>

            <div class="filter-row">
                <button
                    class="filter-button active"
                    data-type=""
                >
                    ทั้งหมด
                </button>

                <button
                    class="filter-button"
                    data-type="income"
                >
                    รายรับ
                </button>

                <button
                    class="filter-button"
                    data-type="expense"
                >
                    รายจ่าย
                </button>
            </div>

            <div id="transaction-list" class="transaction-list">
            </div>

            <div
                id="empty-state"
                class="empty-state hidden"
            >
                <div class="empty-icon">🐿️</div>
                <h3>ยังไม่มีรายการ</h3>
                <p>ส่งข้อความหา Coinly เพื่อบันทึกรายการแรก</p>
            </div>

            <button
                id="load-more-button"
                class="load-more-button hidden"
            >
                ดูเพิ่มเติม
            </button>
        </section>
        <div
            id="edit-modal"
            class="modal hidden"
            role="dialog"
            aria-modal="true"
            aria-labelledby="edit-modal-title"
        >
            <div
                class="modal-backdrop"
                data-close-modal
            ></div>

            <div class="modal-panel">
                <div class="modal-header">
                    <h2 id="edit-modal-title">
                        แก้ไขรายการ
                    </h2>

                    <button
                        type="button"
                        class="modal-close-button"
                        data-close-modal
                        aria-label="ปิด"
                    >
                        ×
                    </button>
                </div>

                <form id="edit-transaction-form">
                    <input
                        type="hidden"
                        id="edit-transaction-id"
                    >

                    <label class="form-label">
                        ประเภท
                        <select
                            id="edit-type"
                            class="form-control"
                            required
                        >
                            <option value="income">
                                รายรับ
                            </option>

                            <option value="expense">
                                รายจ่าย
                            </option>
                        </select>
                    </label>

                    <label class="form-label">
                        หมวดหมู่
                        <select
                            id="edit-category"
                            class="form-control"
                            required
                        ></select>
                    </label>

                    <label class="form-label">
                        จำนวนเงิน
                        <input
                            id="edit-amount"
                            class="form-control"
                            type="number"
                            min="0.01"
                            step="0.01"
                            required
                        >
                    </label>

                    <label class="form-label">
                        วันที่
                        <input
                            id="edit-date"
                            class="form-control"
                            type="date"
                            required
                        >
                    </label>

                    <label class="form-label">
                        หมายเหตุ
                        <textarea
                            id="edit-note"
                            class="form-control"
                            rows="3"
                            maxlength="300"
                        ></textarea>
                    </label>

                    <div class="modal-actions">
                        <button
                            type="button"
                            class="secondary-button"
                            data-close-modal
                        >
                            ยกเลิก
                        </button>

                        <button
                            id="save-edit-button"
                            type="submit"
                            class="primary-button"
                        >
                            บันทึก
                        </button>
                    </div>
                </form>
            </div>
        </div>
        <div id="error-box" class="error-box hidden">
        </div>
    </div>

    <script
        charset="utf-8"
        src="https://static.line-scdn.net/liff/edge/2/sdk.js"
    ></script>

    <script src="./app.js?v=5" defer></script>
</body>
</html>
