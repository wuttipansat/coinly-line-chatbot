announce:
  title: "ประกาศจากระบบ"
  enabled: true
  text: |
    สวัสดีอู๊ด 🐷👋
    นี่คือ Coinly ผู้ช่วยบันทึกรายรับ–รายจ่ายส่วนตัวผ่าน LINE

    ตอนนี้สามารถพิมพ์รายการได้เลย เช่น
    “กินข้าว 80 บาท”
    “ได้เงินเดือน 15000”
    “ซื้อกาแฟ 55 บาท”

    Coinly จะช่วยบันทึกให้อัตโนมัติ และสามารถดูสรุปหรือรายการล่าสุดได้ด้วยคำสั่ง เช่น
    “วันนี้”
    “เดือนนี้”
    “รายการ”

    ลองเริ่มบันทึกรายการแรกได้เลยอู๊ด 🐷💰