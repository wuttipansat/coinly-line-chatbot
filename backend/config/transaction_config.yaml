transaction_types:
  income: รายรับ เงินที่ได้รับหรือหาได้
  expense: รายจ่าย เงินที่จ่าย ซื้อ หรือใช้ไป

categories:
  income:
    salary:
      label: เงินเดือน
      description: ค่าจ้างประจำ รายได้จากงานประจำ
      icon: "💰"

    freelance:
      label: รายได้เสริม
      description: ฟรีแลนซ์ งานพิเศษ ค่าจ้างพิเศษ
      icon: "💻"

    investment:
      label: การลงทุน
      description: กำไรจากการลงทุน ปันผล ดอกเบี้ย หุ้น คริปโต
      icon: "📈"

    gift:
      label: ของขวัญ
      description: เงินที่ได้รับเป็นของขวัญ หรือมีคนให้
      icon: "🎁"

    other:
      label: รายรับอื่น ๆ
      description: รายรับประเภทอื่น ๆ
      icon: "💵"

  expense:
    food:
      label: อาหาร
      description: อาหาร เครื่องดื่ม น้ำดื่ม ของกิน กาแฟ ชานม ร้านอาหาร ของสด
      icon: "🍜"

    transport:
      label: การเดินทาง
      description: ค่าเดินทางทั่วไปในชีวิตประจำวัน เดินทาง รถไฟฟ้า รถเมล์ แท็กซี่ น้ำมัน ค่ารถ ค่าโดยสาร
      icon: "🚗"

    tourism:
      label: ท่องเที่ยว
      description: ค่าใช้จ่ายสำหรับการท่องเที่ยวทั้งในประเทศและต่างประเทศ เช่น ค่าโรงแรม ที่พัก รีสอร์ต ทริปท่องเที่ยว แพ็กเกจทัวร์ ค่ากิจกรรมระหว่างท่องเที่ยว ค่าเดินทางที่เกิดจากทริปท่องเที่ยว ไม่ใช่ค่าเดินทางประจำวัน
      icon: "🧳"

    shopping:
      label: ช้อปปิ้ง
      description: ซื้อของ เสื้อผ้า รองเท้า gadget ของใช้ส่วนตัว ของออนไลน์
      icon: "🛍️"

    housing:
      label: ที่อยู่อาศัย
      description: ค่าเช่า ค่าส่วนกลาง บ้าน คอนโด ซ่อมบ้าน เฟอร์นิเจอร์
      icon: "🏠"

    utilities:
      label: ค่าสาธารณูปโภค
      description: ค่าน้ำประปา ค่าไฟ อินเทอร์เน็ต โทรศัพท์ บิลต่าง ๆ
      icon: "💡"

    health:
      label: สุขภาพ
      description: ค่าหมอ โรงพยาบาล ยา ตรวจสุขภาพ กายภาพบำบัด ประกันสุขภาพ ฟิตเนส
      icon: "🏥"

    education:
      label: การศึกษา
      description: ค่าเรียน หนังสือ คอร์สเรียน อบรม การศึกษา
      icon: "📚"

    entertainment:
      label: ความบันเทิง
      description: ดูหนัง เกม เพลง คอนเสิร์ต สวนสนุก งานอดิเรก และกิจกรรมพักผ่อนที่ไม่ใช่กีฬา
      icon: "🎬"

    subscription:
      label: สมาชิกและบริการรายเดือน
      description: Netflix Spotify YouTube Premium แอปสมาชิก ค่าสมาชิกรายเดือน
      icon: "📱"

    sport:
      label: กีฬา
      description: กีฬา การออกกำลังกาย ค่าสนาม และอุปกรณ์กีฬา
      icon: "⚽"

    other:
      label: รายจ่ายอื่น ๆ
      description: รายจ่ายประเภทอื่น ๆ
      icon: "🧾"