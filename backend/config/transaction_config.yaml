# transaction_types:
#   income: Money received or earned
#   expense: Money spent or paid

# categories:
#   income:
#     salary: Monthly salary or regular job income
#     freelance: Freelance work or side job income
#     investment: Investment return, dividend, or profit
#     gift: Money received as gift
#     other: Other income

#   expense:
#     food: Meals, drinks, groceries, coffee
#     transport: Train, taxi, fuel, bus, travel fare
#     shopping: Clothes, gadgets, personal items
#     housing: Rent, condo fee, home expense
#     utilities: Electricity, water, internet, phone bill
#     health: Medicine, hospital, fitness, healthcare
#     education: Course, book, learning material
#     entertainment: Movie, game, music, activity
#     subscription: Netflix, Spotify, app subscription
#     travel: Hotel, flight, trip expense
#     other: Other expense


transaction_types:
  income: รายรับ เงินที่ได้รับหรือหาได้
  expense: รายจ่าย เงินที่จ่าย ซื้อ หรือใช้ไป

categories:
  income:
    salary: เงินเดือน ค่าจ้างประจำ รายได้จากงานประจำ
    freelance: รายได้เสริม ฟรีแลนซ์ งานพิเศษ ค่าจ้างพิเศษ
    investment: กำไรจากการลงทุน ปันผล ดอกเบี้ย หุ้น คริปโต
    gift: เงินที่ได้รับเป็นของขวัญ หรือมีคนให้
    other: รายรับอื่น ๆ

  expense:
    food: อาหาร เครื่องดื่ม ของกิน กาแฟ ชานม ร้านอาหาร ของสด ของใช้ในครัว
    transport: ค่าเดินทาง รถไฟฟ้า รถเมล์ แท็กซี่ น้ำมัน ค่ารถ ค่าโดยสาร
    shopping: ซื้อของ เสื้อผ้า รองเท้า gadget ของใช้ส่วนตัว ของออนไลน์
    housing: ค่าเช่า ค่าส่วนกลาง บ้าน คอนโด ซ่อมบ้าน เฟอร์นิเจอร์
    utilities: ค่าน้ำ ค่าไฟ อินเทอร์เน็ต โทรศัพท์ บิลต่างๆ
    health: ค่าหมอ โรงพยาบาล ยา สุขภาพ ฟิตเนส ประกันสุขภาพ กีฬา
    education: ค่าเรียน หนังสือ คอร์สเรียน อบรม การศึกษา
    entertainment: ดูหนัง เกม เพลง งานอดิเรก กิจกรรม ความบันเทิง
    subscription: Netflix Spotify YouTube Premium แอปสมาชิก ค่าสมาชิกรายเดือน
    travel: โรงแรม ตั๋วเครื่องบิน ทริป ท่องเที่ยว ที่พัก
    other: รายจ่ายอื่นๆ